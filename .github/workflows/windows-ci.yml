name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore GlassDesk.slnx

      - name: Build Release
        run: dotnet build GlassDesk.slnx --configuration Release --no-restore --maxcpucount:1

      - name: Test Core
        run: dotnet test tests/GlassDesk.Core.Tests/GlassDesk.Core.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=minimal"

      - name: Test AppServices
        run: dotnet test tests/GlassDesk.AppServices.Tests/GlassDesk.AppServices.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=minimal"

      - name: Test Dock except isolated desktop capture recovery
        # This native test is run locally on a separate Win32 desktop with a changing fixture window.
        # Hosted runner desktop capture availability is not a stable CI contract.
        run: dotnet test tests/GlassDesk.Dock.Tests/GlassDesk.Dock.Tests.csproj --configuration Release --no-build --no-restore --filter "FullyQualifiedName!~IdleCaptureBufferTests.ShortHidesStayWarmAndLongHidesRetireTheHelperBeforeResume" --logger "console;verbosity=minimal"

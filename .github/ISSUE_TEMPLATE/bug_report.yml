name: 缺陷报告
description: 报告可复现的 LG Dsk 问题
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请不要在公开报告中粘贴用户名、私人路径、完整应用列表或未经脱敏的日志。
  - type: input
    id: version
    attributes:
      label: LG Dsk 版本与安装方式
      placeholder: 1.4.1，安装版或便携版
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 build
    validations:
      required: true
  - type: textarea
    id: display
    attributes:
      label: 显示与图形环境
      description: 可填写分辨率、缩放、刷新率、显示器数量、GPU 和驱动版本。
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 打开……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已检查附件和日志，没有泄露个人信息或私人数据。
          required: true
